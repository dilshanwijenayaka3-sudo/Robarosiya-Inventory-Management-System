{% extends 'base.html' %}{% block title %}Edit Item{% endblock %}{% block content %}<section class="panel"><h2>{{item.code}} · {{item.name}}</h2><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" value="{{item.name}}" required></label><label>Category<input name="category" value="{{item.category}}" required></label><label>Minimum Stock<input name="min_qty" type="number" min="0" step="any" value="{{item.min_qty}}"></label><label>Purchase Price<input name="price" type="number" min="0" step="0.01" value="{{item.price}}"></label><div class="formactions"><button class="primary">Save Changes</button> <a href="{{url_for('items')}}">Cancel</a></div></form></section>{% endblock %}
