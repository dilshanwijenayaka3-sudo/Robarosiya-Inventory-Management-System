{% extends 'base.html' %}{% block content %}<section class="auth-card"><img class="auth-logo" src="{{logo_data_url}}" alt="Robarosiya Hotel"><h1>{{page}}</h1><p>Robarosiya Hotel Inventory Management</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Username<input name="username" required minlength="3" autocomplete="username"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="{{'new-password' if page.startswith('First') else 'current-password'}}"></label><button class="primary full">{{'Create Admin Account' if page.startswith('First') else 'Sign In'}}</button></form><small>Offline • Windows • Secure local login</small></section>{% endblock %}
